# Model constants: agencies, jurisdictions, and source file names. Edited by hand.
schema: tahoe-transit-funding-data/1
modelVersion: tahoe-transit-funding-1.0
sourceFiles:
  scen: Example Transit Financial Scenario Workbook.xlsx
  plan: Financial PlanG.xlsx
  v1g: Funding Model V1G.xlsx
  fed: Federal Funds, Oct. 28, 2026.pdf
  state: State Funds, Oct. 28, 2026.pdf
  loc1: Local Funds 1 of 3, Oct. 28, 2026.pdf
  loc2: Local Funds 2 of 3, Oct. 28, 2026.pdf
  loc3: Local Funds 3 of 3, Oct. 28, 2026.pdf
# Source groups on Sources and notes. Each group is one numbered source, and every citation to a member file shows the
# group's number. The data still names the file, tab, and cell behind each value, and the build report traces every value.
# Members can be source files (sourceFiles) or published documents (references). listMembers: true lists them under the
# group, each linked: files by sourceFileUrls, documents by their url.
sourceFileGroups:
- key: memo
  name: Transit Study Funding Memo Inputs
  note: Working files prepared for the Tahoe Transit Study funding memo. They provide FY 26-27 operating costs, service statistics, operator rates, revenue amounts, and route allocations. They also provide the FTA split, match requirements, five-year revenue projections, and the state and local conditions on each route.
  members: [plan, scen, v1g]
- key: factSheets
  name: Transit Study Funding Fact Sheets
  note: TRPA's transit funding fact sheets, Oct. 28, 2026 versions. They give the amount, purpose, match, and restrictions for each federal, state, and local source.
  members: [fed, state, loc1, loc2, loc3]
  listMembers: true
- key: tda
  name: Transportation Development Act (TDA)
  note: California's TDA funds transit through the Local Transportation Fund, a quarter-cent sales tax returned to the county where it was collected, and State Transit Assistance, from the sales tax on diesel fuel. TRPA apportions both for the California side of the Tahoe region.
  members: [tdaAlloc2627, tdaHandbookTrpa, tdaGuidebookCa]
  listMembers: true
- key: tartSystemsPlan
  name: TART 2025 Systems Plan Update
  note: Placer County, November 18, 2025. Current TART frequency, the preferred service scenario, and the cost of 30-minute peak service.
  members: [tartPlan, tartMemo]
  listMembers: true
sourceFileNotes:
  scen: State and local route conditions (costs tab). Its costs and rates are replaced by Funding Model V1G.
  plan: Revenue conditions and match notes (Revenue %s, columns B and C) and the five-year revenue tables (Tables A1 and A2). Its FY 26-27 
    amounts and shares are replaced by Funding Model V1G.
  v1g: 'Source of truth for existing transit data since Nov. 13, 2026: FY 26-27 revenue by source and agency, route allocations, and operating
    cost by route (Per Route Model Clean), service statistics (Operating Stats), operator rates (VRH Rates), and the FTA split.'
  fed: Federal funding fact sheet (FY 25-26 budgeted amounts, purpose, match, restrictions).
  state: State funding fact sheet.
  loc1: Local funding fact sheet, part 1 of 3 (TART partners, Placer County TOT, Washoe RTC, Town of Truckee, TTD local appropriation).
  loc2: Local funding fact sheet, part 2 of 3 (Nevada State Parks, Tahoe Douglas Visitor Authority, NLTE partners, Lake Link public 
    partners).
  loc3: Local funding fact sheet, part 3 of 3 (Lake Link private partners).
# Link for each source's title on Sources and notes. TRPA direction links to the repo copies on GitHub. Fact sheets link to
# the Oct. 28, 2026 versions on trpa.gov. The study workbooks show as one group with no link (sourceFileGroups).
sourceFileUrls:
  fed: https://www.trpa.gov/wp-content/uploads/FederalFunds-10.28.2026.pdf
  state: https://www.trpa.gov/wp-content/uploads/StateFunds-10.28.2026.pdf
  loc1: https://www.trpa.gov/wp-content/uploads/LocalFunds1of3-7columns-10.28.2026.pdf
  loc2: https://www.trpa.gov/wp-content/uploads/LocalFunds2of3-7columns-10.28.2026.pdf
  loc3: https://www.trpa.gov/wp-content/uploads/LocalFunds3of3-6columns-10.28.2026.pdf
  trpa: 'https://github.com/trpa-agency/TransitStudy/blob/main/TransitFundingModel/docs/Domain%20Lead%20Answers%202026-10-23.md'
  trpa2: 'https://github.com/trpa-agency/TransitStudy/blob/main/TransitFundingModel/docs/TRPA%20Answers%202026-11-13.md'
# Published documents cited in the model, numbered after the source groups and TRPA answers. A document can belong to a group (sourceFileGroups).
references:
  tartPlan:
    name: TART 2025 Systems Plan Update, Board presentation, Item 04A, Placer County Board of Supervisors, November 18, 2025
    note: Preferred service scenario and the cost of 30-minute peak service on TART fixed routes (slides 30 and 31).
    url: 
      https://www.placer.ca.gov/DocumentCenter/View/99365/2025-111825-PowerPoint-Item-04A-DPW---Tahoe-Truckee-Area-Regional-Transit-2025-Systems-Plan-Update
  tartMemo:
    name: TART 2025 Systems Plan Update, staff report, Placer County Public Works, November 18, 2025
    note: Current 60-minute frequency on all TART fixed routes, and the peak-season and year-round 30-minute options.
    url: https://www.placer.ca.gov/DocumentCenter/View/99284/04A
  tdaAlloc2627:
    name: TRPA FY 2026-27 transit funding allocations staff report, November 2026
    note: LTF and STA allocations to TTD and TART for FY 26-27, prepared for the TRPA Governing Board's November 2026 meeting (Attachments A and B).
    url: https://www.trpa.gov/wp-content/uploads/Transportation-Committee-Agenda-Item-No.-5B-Consent-Calendar-Item-No.-6A-Transit-Fundingv.2.pdf
  tdaHandbookTrpa:
    name: TRPA Transportation Development Act Handbook, March 2023
    note: How TRPA apportions, allocates, and audits LTF and STA in the Tahoe region.
    url: https://www.trpa.gov/wp-content/uploads/2023-TDA-Handbook.pdf
  tdaGuidebookCa:
    name: Caltrans Transportation Development Act Statutes and California Codes of Regulations, July 2018
    note: The state law and regulations behind TDA.
    url: https://dot.ca.gov/-/media/dot-media/programs/rail-mass-transportation/documents/f0009844-tda-07-2018-a11y.pdf
  ftaSplit:
    name: Lake Tahoe FTA Sub-Allocation (5307, 5339, 5310), FY 26 full-year apportionments, TRPA
    note: Earned-share split of the Lake Tahoe UZA apportionment by urban revenue miles, population, and ridership, and the 75 percent operations share of 5307. Same inputs as the V1G FTA Allocation Split tab.
    url: https://www.trpa.gov/wp-content/uploads/FY26FTA-Full-Year-5307_5339_5310-ApportionmentFINAL.pdf
  ftaMou:
    name: Memorandum of Understanding between TMPO, Tahoe Transportation District, and Placer County on transit planning and programming of federal funds, 2016
    note: Section 3 and Exhibit A set the 5307 and 5339 sub-allocation method. Exhibit A adds a base allocation per operator before the earned share. The FY 26 split uses earned share only.
    url: https://www.trpa.gov/wp-content/uploads/Tahoe_Transit_MOU_Final-2017.pdf
  ttdFpc20261104:
    name: TTD Finance and Personnel Committee meeting packet, November 4, 2026
    note: Attachment A, Transit Fund statement of operations for July and August 2026. Emerald Bay Shuttle (micro-transit) farebox revenue of $12,740 year to date against a board-approved FY 2027 budget of $25,000.
    url: https://tahoetransportation.org/wp-content/uploads/2026/10/TTD-Finance-Comm-Mtg-Agenda-Packet-2026-11-4.pdf
# Funding sources grid on Inputs and assumptions: lines are grouped by program into collapsible rows.
# Map a line's program name to the group it shows under. Programs not listed group under their own name.
sourceGroups:
  FTA 5307 (flexed CMAQ): FTA 5307 Urbanized Area Formula
  FTA 5307 carryover: FTA 5307 Urbanized Area Formula
  FTA 5310 carryover: FTA 5310
  FTA 5339 (Lake Tahoe UZA and NV DOT): FTA 5339 Bus and Bus Facilities
  FTA 5339 (Lake Tahoe UZA): FTA 5339 Bus and Bus Facilities
  TDA LTF, TRPA apportionment: TDA Local Transportation Fund
  TDA STA, TRPA apportionment: TDA State Transit Assistance
  Transient occupancy tax: Placer County TOT   # the only TOT in the model today
# Groups are by funding program or type, never by what the money pays for. These program names describe a use,
# so their lines show one by one (per TRPA review, Nov. 24, 2026).
ungroupPrograms:
  - Emerald Bay Shuttle pilot
  - Lake Link funding agreement
  - Lake Link partner contribution
  - Resort contribution
  - County contribution
# Submit as a data update (header button on the full model): who receives the request email.
dataUpdates:
  # Survey123 survey "Funding Model Data Update Request" (ArcGIS Online, survey item fc9a1ee7eeb843189f7b50de014abf60).
  # serviceUrl is the survey's feature service, ending in FeatureServer. The page posts with applyEdits:
  # one record to layerId and one row per change to tableId (the "changes" repeat).
  serviceUrl: https://services5.arcgis.com/fXXSUzHD5JjcOt1v/arcgis/rest/services/service_97add89ea7044725abf93da481f35bfa_form/FeatureServer   # the survey's public submission view
  layerId: 0
  tableId: 1
  contact: rshaw@trpa.gov   # shown if a submission fails, so people know where to send the copied change list
# Scenario inputs taken from published plans. Used by the scenario presets.
scenarios:
  peak30:
    # 30-minute frequency on TART fixed routes in the winter and summer months, from 60 minutes today.
    cost: 2683400  # annual operating cost increase in FY 26-27 dollars; the model grows it at TART's escalator and starts it in the year the user picks
    hours: 16100            # added annual service hours
    miles: 318200           # added annual service miles
    riders: 153000          # added annual riders
    routes: [TART-WS, TART-NS, TART-NV, '89', '267']   # Main Line (West Shore, North Shore, Nevada), Hwy 89, Hwy 267. Night service is not included.
    split: Placeholder. The plan gives a systemwide total. The model splits it across routes by each route's annual service hours.
    cite: [tartPlan, tartMemo]
