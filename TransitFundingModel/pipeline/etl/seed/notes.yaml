# Data notes and the agreements inventory shown on the page. Edited by hand.
# Write TRPA direction as "per TRPA (Oct. 23, 2026)" or "(TRPA, Oct. 23, 2026)"; the page turns it into a superscript.
dataNotes:
- title: Costs tab total double-counts TART Main Line
  text: The costs tab total ($23.08 million, K25) sums the Main Line subtotal (row 16) and its three segments (rows 13–15), counting about 
    $2.50 million twice. This model counts the segments once.
  cite: Example Transit Financial Scenario Workbook.xlsx › costs K25, K13:K16
- title: Route 30 cost
  text: The model uses the Route 30 contract cost in the funding model, $644,796 (about $184.23 per service hour), per TRPA (Nov. 13, 2026).
    It replaces $147.80 per hour (about $517,300), which TRPA set on Oct. 23, 2026 to match the Emerald Bay Shuttle budget. The four Emerald
    Bay Shuttle revenue sources total $619,796, which leaves a $25,000 gap.
  cite: Funding Model V1G.xlsx › VRH Rates K29; Per Route Model Clean R10, R56:R57
- title: Route shares
  text: Route shares come from the FY 26-27 route allocations in the funding model, per TRPA (Nov. 13, 2026). Most sources are split by 
    share of service hours or miles. The model splits the funding model's single Main Line column across West Shore, North Shore, and Nevada
    by service hours. Washoe RTC stays on the Nevada segment.
  cite: Funding Model V1G.xlsx › Per Route Model Clean rows 12 to 52; Operating Stats F19:F21
- title: TNT/TMA service costs
  text: 'The model uses the funding model costs: Park & Ride at the $894,233 contract cost (80 percent winter, 20 percent summer), North Lake
    Tahoe Express at $694,260, and vanpools at $195,800, per TRPA (Nov. 13, 2026). TRPA has not yet confirmed that the NLTE figure is the contract
    cost; on the estimated 1,200 service hours it works out to $578.55 per hour. TNT/TMA program administration and regional marketing, and the
    membership and management revenues that pay for them, are outside the per-route model.'
  cite: Funding Model V1G.xlsx › Per Route Model Clean AE10:AH10; Operating Stats F32:F34
- title: LCTOP on Nevada routes
  text: The State Funds fact sheet restricts LCTOP to California, but the draft shares on Revenue %s assign part of it to Nevada routes 19X,
    22, and 28. The model flags these cells.
  cite: State Funds, Oct. 28, 2026.pdf › LCTOP; Financial PlanG.xlsx › Revenue %s row 15
- title: Federal funds above the operating share
  text: At the costs tab route costs, the draft shares put more federal money on Routes 19X, 22, and 50 than the 50 percent operating share 
    allows, and TTD holds more 5311 than its two rural routes can absorb at 50 percent. TTD's own per-route worksheet uses $912,052 of the 
    $1,798,577 in 5311. Confirm how the remainder is used (administration, capital, or other routes).
  cite: Financial PlanG.xlsx › T2-4 Q146:R146
- title: Sources the funding model leaves out
  text: 'Per TRPA (Nov. 13, 2026), FY 26-27 amounts follow the funding model. Sources it does not list are $0: the TTD local appropriation ($232,235
    in FY 25-26), Emerald Bay Shuttle fares ($53,500 in the financial plan), Martis Zones of Benefit ($50,000 in FY 25-26), and TART''s FTA 5310
    share. The North Tahoe Community Alliance line is removed: NTCA administers Placer County TOT, which the model already counts. The Nevada
    State general fund allocation to TTD ($346,500 in FY 25-26) stays at $0.'
  cite: Funding Model V1G.xlsx › Per Route Model Clean; Local Funds 1 of 3, Oct. 28, 2026.pdf › Local Appropriation, Martis Zones of 
    Benefit; State Funds, Oct. 28, 2026.pdf › Nevada State
- title: Fact sheet and plan differences
  text: 'TDVA is $65,000 on the fact sheet (FY 25-26) and $120,000 in the FY 26-27 plan. The Travel North Tahoe Nevada card shows "TTD budgeted
    $8,000" though the funded system is NLTE. TRPA (Oct. 23, 2026): use the plan amount ($120,000).'
  cite: Local Funds 2 of 3, Oct. 28, 2026.pdf › Tahoe Douglas Visitor Authority; Travel North Tahoe Nevada
- title: Electrification credits
  text: Revenue %s notes call electrification credits "not real money, only used as match." The fact sheet lists $8,000 budgeted for TTD 
    operations. The model counts them as match only; this can be switched in Details.
  cite: Financial PlanG.xlsx › Revenue %s B16:C16; State Funds, Oct. 28, 2026.pdf › Electrification Credits
- title: Match rates for NDOT 5311
  text: 'Revenue %s lists 50 percent non-federal match for 5311; partner notes say NDOT match is 20 percent for administration, 40 percent for
    operating, and 5 percent for capital. TRPA (Oct. 23, 2026): go with 50 percent non-federal for now; we can change it later.'
  cite: Financial PlanG.xlsx › Revenue %s C6, F64
- title: Lake Link and placeholder jurisdiction shares
  text: Jurisdiction shares split each service equally among the jurisdictions in the costs tab, except Lake Link (one-third Douglas, 
    two-thirds CSLT). ADA paratransit services have no local conditions listed. Lake Link VSH are contract hours, not actuals.
  cite: Example Transit Financial Scenario Workbook.xlsx › costs columns C, U12
- title: Fares on Route 30
  text: The funding model shows $0 in Emerald Bay Shuttle fares for FY 26-27, so the model carries no Route 30 fares. Route 30 charges $5 
    one way.
  cite: Funding Model V1G.xlsx › Per Route Model Clean D51; Fare Rates C10
- title: 'Service plan: replacing 19X'
  text: The financial plan adds the US 50 service cost without removing Route 19X. To model a replacement, include the element and exclude 
    Route 19X.
  cite: Financial PlanG.xlsx › T2-4 rows 21, 29
- title: Vanpools
  text: The funding model includes vanpools at $195,800, paid by Placer County TOT through TNT/TMA. The Operating Stats tab has no vanpool 
    row, so vanpools have no service hours.
  cite: Funding Model V1G.xlsx › Per Route Model Clean AH10, AH34
- title: Open questions in the source files
  text: '"What revenues can we count on for 27-28 for Lake Link?" and "Do we recommend Transportation user fee?" A new regional source can be
    tested with Add source on the Funding sources tab.'
  cite: Financial PlanG.xlsx › Questions F4, F6
- title: Fixed costs for contractors
  text: The costs tab notes that fixed costs could be separated out, but that is harder for private contractors, and fixed costs change with
    large service changes. The model uses fully allocated rates.
  cite: Example Transit Financial Scenario Workbook.xlsx › costs W4
- title: Funding rule decisions from the funding lead (Oct. 23, 2026)
  text: 'No optimizer: the tool flags problems and shows trade-offs. Match is tested per grant, per recipient. 5307 operating at 50 percent non-federal;
    5310 at 20 percent non-federal (to confirm); NDOT 5311 at 50 percent for now. Fares count as local match. Toll credits are assumed unavailable.
    “Ideally used in” conditions are preferences, and using a source outside its intended jurisdiction is allowed but highlighted. Jurisdiction
    cost splits stay even-split placeholders for now. Capital is out of scope for this iteration; planning and administration funds are in scope.'
  cite: TRPA (Oct. 23, 2026)
- title: Model decisions from TRPA (Nov. 13, 2026)
  text: 'Funding Model V1G replaces the earlier workbooks for existing transit data: costs, service statistics, operator rates, FY 26-27 revenue,
    and route allocations. TTD SB 125 is $500,000. Lake Link private partners use the funding model amounts. The Lake Tahoe Visitors Authority
    money is separate from the Tahoe Blue Events Center fee. Visit Truckee Tahoe is the same contribution as the earlier "Additional Truckee"
    line, and the Park & Ride partners line includes Northstar. For the TART Connect fare savings in the TART Systems Plan, use the smaller staff
    report figure, $758,000 a year, until updated. Under TTD absorbs Lake Link, SSTMA administration costs carry over to TTD.'
  cite: TRPA (Nov. 13, 2026)
- title: South Tahoe Transit JPA
  text: The JPA is not an operator, and the working assumption is that it will not become one (TRPA, Oct. 23, 2026). South shore fixed route
    funding stays with TTD in this model.
  cite: TRPA (Oct. 23, 2026)
- title: Funding cliffs with no defined replacement
  text: SB 125 ends after FY 26-27 ($1,250,000 across TTD and Lake Link) and the Route 30 pilot funds end after FY 27-28. No replacement 
    funding is defined yet; TRPA (Oct. 23, 2026) asked that this be highlighted as a gap and a need. See the Five-year outlook tab.
  cite: TRPA (Oct. 23, 2026)
- title: Scenario presets
  text: 'The scenario bar has three presets: the Meyers paratransit and microtransit pilot, TTD absorbs Lake Link, and 30-minute peak frequency
    on TART fixed routes. Each preset is a set of logged edits on top of the current scenario. Reset returns to the source data. The 30-minute
    peak preset starts in a fiscal year the user picks, FY 27-28 by default, per TRPA (Nov. 13, 2026).'
  cite: TRPA (Oct. 23, 2026); TRPA (Nov. 13, 2026)
agreements:
- title: Lake Link funding agreements with Douglas County and the City of South Lake Tahoe
  text: The only two written Lake Link contracts. The plan assumes support continues at existing levels after the current terms end.
  cite: Financial PlanG.xlsx › Per Route Model D88; T2-4 note 6
- title: SSTMA operating contract for Lake Link (Downtowner/Via)
  text: Sets the Lake Link hourly cost and the 2027 contract service hours.
  cite: Example Transit Financial Scenario Workbook.xlsx › VRH Rates L9; Financial PlanG.xlsx › T2-4 note 2
- title: 'Emerald Bay Shuttle (Route 30) pilot: TTD–Via contract and pilot funding'
  text: Keep Tahoe Blue, Carbon Reduction Program, El Dorado County, and Placer County funds committed through FY 27-28.
  cite: Financial PlanG.xlsx › T2-4 rows 79–82
- title: Placer County TART Connect contract
  text: Contract-specified escalation of 5 percent per year.
  cite: Example Transit Financial Scenario Workbook.xlsx › VRH Rates L15
- title: My Ride to Work contracts with TART and TNT/TMA
  text: Bus and van rates for Park & Ride shuttles and NLTE; the MRTW contract is listed at $488,320.
  cite: Example Transit Financial Scenario Workbook.xlsx › VRH Rates rows 18–21; Financial PlanG.xlsx › Revenue %s M81
- title: FTA 5307, 5339, and 5310 sub-allocation between TTD and Placer County
  text: Earned-share worksheet based on revenue miles, population, and ridership. FTA expects the MPO and designated recipients to set the 
    split through a "fair and rational" process. Per TRPA (Nov. 20, 2026), an MOU documents the split.
  cite: Financial PlanG.xlsx › FTA Allocation Split (26-27); Revenue %s AD59
- title: TRPA TDA apportionment (LTF and STA) to TTD and TART
  text: The plan assumes no change in the TRPA TDA split; TTD applies one-third to rural and two-thirds to urban routes.
  cite: Financial PlanG.xlsx › T2-4 note 2; Revenue %s AE10
- title: LCTOP rotation between TTD and TART
  text: LCTOP alternates every other year based on ridership.
  cite: Financial PlanG.xlsx › Revenue %s D67
- title: NDOT 5311 subrecipient agreement with TTD
  text: Partner notes record NDOT match at 20 percent for administration, 40 percent for operating, and 5 percent for capital.
  cite: Financial PlanG.xlsx › Revenue %s F64
- title: Tahoe Blue Events Center transportation mitigation fee
  text: A $3 ticket surcharge allocated to transit, with an annual attendee cap.
  cite: Financial PlanG.xlsx › T2-4 note 7
- title: Partner cost-sharing practices on TTD routes
  text: Costs are allocated by route by percent of miles per month, utility costs are pooled systemwide by partner agreement, and whoever 
    receives a route's benefit gets its urban or rural benefit.
  cite: Financial PlanG.xlsx › Revenue %s E61:E63, C65
- title: Lake Link private partners
  text: SLTTID, Heavenly, Caesars, Round Hill Pines, Advance Learning, LTVA, and LTCC are listed in the FY 26-27 funding model, with no 
    written commitments on file. TRPA notes that the Caesars and Round Hill Pines money pays for the Lake Link special summer service. 
    Multi-year contribution agreements would let the plan count on these funds.
  cite: Funding Model V1G.xlsx › Per Route Model Clean F44:F50; Financial PlanG.xlsx › T2-4 note 8
