# Regional Transit Funding Model: build settings.
# Paths are relative to this file (pipeline/etl).

# Folder that holds the source workbooks. Point this at the synced SharePoint
# folder "4. Funding Implementation Memo" to build from the live copies.
workbook_folder: ../../source-data/workbooks

# Funding Model V1G (Nov. 10, 2026) is the source of truth for existing transit data: FY 26-27 costs,
# service statistics, operator rates, revenue amounts, route allocations, and the FTA split (TRPA direction, Nov. 13, 2026).
# The two older workbooks are read only for what V1G does not have:
#   plan: revenue conditions and match notes (Revenue %s, columns B and C) and the five-year revenue tables (Tables A1 and A2)
#   scen: state and local route conditions (costs tab)
workbooks:
  v1g:
    file: Funding Model V1G.xlsx
  scen:
    file: Example Transit Financial Scenario Workbook.xlsx
  plan:
    file: Financial PlanG.xlsx

seed_folder: seed

output:
  data_folder: ../data                              # model-data.json, model-data.js, build-report.md
  template: ../template/transit-funding-model.template.html
  dist: ../dist/transit-funding-model.html          # single file with the data inlined
  check_page: ../../model/transit-funding-model.html  # page that --check compares against

# Funding Model V1G, Operating Stats tab. One row per service: trips, hours, miles, and data year.
costs_tab:
  wb: v1g
  sheet: Operating Stats
  header_row: 6                 # hint only; the row is found by label_header
  label_header: Service/Route
  agency_header: Agency
  fields:                       # model field: column header in the header row
    trips: Passenger-Trips
    vsh: Vehicle Service Hours
    vsm: Vehicle Service Miles
    dataYear: Data Year
  ignore_labels:
    - Main Line                 # subtotal of West Shore, N Shore, and Nevada; counting it would double count about $2.5 million
    - Total
    - Lake Link                 # total of the three Lake Link zone rows, which are the model's services (per TRPA, Nov. 20, 2026)
    - TC Z1                     # TART Connect zone rows are example one-third splits of the service total
    - TC Z2
    - TC Z3
    - TC Z4

# Scenario workbook, costs tab: state and local route conditions, which V1G does not carry.
conditions_tab:
  wb: scen
  sheet: costs
  header_row: 3
  label_header: Service/Route
  agency_header: Agency
  fields:
    stateCond: State Route Conditions
    localCond: Local Route Conditions

# Funding Model V1G, Per Route Model Clean tab. FY 26-27 revenue by source and agency (columns D to G),
# each source's allocation to routes (columns K to AH), cost per VSH (row 9), and estimated operating cost (row 10).
route_model:
  wb: v1g
  sheet: Per Route Model Clean
  header_row: 5                 # hint only; found by header_label
  header_label: North Lake Tahoe Express
  label_before: D               # source labels are in column C
  first_route_col: K
  last_route_col: AH
  agency_cols: {TTD: D, TART: E, SSTMA: F, TNTTMA: G}
  columns:                      # route column header: service id. A list splits the column across services by VSH.
    19X: 19X
    "22": "22"
    "28": "28"
    "50": "50"
    "55": "55"
    "51": "51"
    ADA Para (TTD): ADA-TTD
    "30": "30"
    Lake Link (Zone 1): LL-Z1
    Lake Link (Zone 2): LL-Z2
    Lake Link (Zone 3): LL-Z3
    Mainline: [TART-WS, TART-NS, TART-NV]   # Main Line is three services in the model
    Hwy 89: "89"
    Hwy 267: "267"
    Night: NIGHT
    ADA Para (Placer): ADA-PLA
    TART Connect (Zone 1): TC
    TART Connect (Zone 2): TC
    TART Connect (Zone 3): TC
    TART Connect (Zone 4): TC
    Park&Ride Shuttle (Winter): PR-W
    Park&Ride Shuttle (Summer): PR-S
    North Lake Tahoe Express: NLTE
    TNTTMA Vanpools: VAN

# Financial PlanG, Revenue %s tab. One row per revenue source.
revenue_tab:
  wb: plan
  sheet: Revenue %s
  header_row: 1                 # hint only; the row is found by header_label
  header_label: Revenue Sources
  label_col: D                  # Revenue Sources
  condition_col: B              # Revenue Conditions
  match_col: C                  # Match Requirements
  first_route_col: F
  last_route_col: AC
  end_label: Total              # source rows end above the row labeled Total in column D
  columns:                      # route column header: service id (a list sums several columns into one service)
    19X: 19X
    "22": "22"
    "28": "28"
    "50": "50"
    "55": "55"
    "51": "51"
    ADA Para (TTD): ADA-TTD
    "30": "30"
    Lake Link (Zone 1): LL-Z1
    Lake Link (Zone 2): LL-Z2
    Lake Link (Zone 3): LL-Z3
    Mainline: null              # TART Main Line is split into three services; set shares for those in the seed
    Hwy 89: "89"
    Hwy 267: "267"
    Night: NIGHT
    ADA Para (Placer): ADA-PLA
    TART Connect (Zone 1): TC
    TART Connect (Zone 2): TC
    TART Connect (Zone 3): TC
    TART Connect (Zone 4): TC
    Park&Ride Shuttle (Winter): PR-W
    Park&Ride Shuttle (Summer): PR-S
    North Lake Tahoe Express: NLTE
    Vanpools: VAN
  ignore_rows: []
