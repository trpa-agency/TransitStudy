# Public and full editions of the Regional Transit Funding Model.
# Paths are relative to this file (pipeline/editions).
# The full edition is the model page with the Existing funding conditions wording below. Password protection is not set up yet.

source_page: ../../model/transit-funding-model.html   # the vetted page; run the main build and copy it to model/ first
output_folder: dist
# Hosted copies. GitHub Pages serves the TransitStudy repo's docs folder, so the public and full pages are copied here on every build.
# Live at https://trpa-agency.github.io/TransitStudy/funding-model/. The main model page is not hosted; the full page covers it.
publish_folder: ../../../docs/funding-model

public:
  file: transit-funding-public.html
  # The public page is the Existing funding conditions page alone, with a link to the full model in the header.
  full_link_text: Open the full model
  status_label: DRAFT   # replaces the Beta chip in the header
full:
  file: transit-funding-full.html
  # Passphrase gate on the full page, adapted from the TRPA Tools QA gate. Keeps casual visitors out; it is not security.
  gate:
    hash: '812e7a731009213c4bfaf51b01b4a606591d715468f0268d5840ce6775c5076e'   # set by set_passphrase.bat; the build stops until it is set. Only the hash is stored, never the passphrase
    salt: trpa-agency.github.io/TransitStudy/funding-model
    key: trpa-funding-model-gate-v2       # browser storage key for the 30-day unlock
    ttl_days: 30
    request_email: rshaw@trpa.gov
    request_subject: Regional Transit Funding Model passphrase
    title: Regional Transit Funding Model
    message: The full model is a working draft for the Transit Working Group staff members. Enter the passphrase to continue.
    logo: https://trpa-agency.github.io/tools/assets/TRPALogo_COLOR.png
    public_link_text: Open the public page
    # Checkbox the visitor must check before the passphrase unlocks the page. The disclaimer is TRPA's standard text.
    agreement: By checking this box, I agree not to share, cite, or publish the data in this model outside my agency without TRPA's approval.
    disclaimer: >-
      While TRPA believes the data is accurate and properly functioning, TRPA disclaims any responsibility for the
      accuracy or correctness of the data. TRPA makes no warranties, express or implied, including but not limited to any
      warranties of merchantability or fitness for a particular purpose, nor shall the distribution of this information
      constitute any warranty.

# Existing funding conditions, on both the public and the full page.
existing_page:
  heading: A Snapshot of Today's Transit Funding Landscape   # replaces "Existing funding conditions, FY 26-27" and its Source data label
  # replaces the generated note under the heading (sources, region totals, and federal funds above the share cap)
  subtext: >-
    Transit funding in the Tahoe Region is complicated, with about 60 revenue sources and four transit providers.
    This page shows an overview of how transit is currently paid for, by operator, by route, and by funding source.
    This page is a draft, and inputs require further stakeholder validation.
